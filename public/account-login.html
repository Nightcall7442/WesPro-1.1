<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в кабинет — WesPro</title>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("billiards_theme") === "dark" ? "dark" : "light";
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/landing.css">
  <style>
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-card {
      width: 100%; max-width: 380px;
      background: var(--glass-strong);
      backdrop-filter: blur(24px) saturate(1.8);
      -webkit-backdrop-filter: blur(24px) saturate(1.8);
      border: 1px solid var(--glass-border);
      border-radius: 24px; box-shadow: var(--shadow);
      padding: 32px 28px; display: flex; flex-direction: column; gap: 14px;
    }
    .auth-card h1 {
      margin: 0; font-family: var(--font-display); font-size: 1.55rem; font-weight: 800;
      text-align: center; letter-spacing: -0.02em; color: var(--text);
    }
    .auth-card .sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin: -4px 0 8px; }
    .auth-error { color: var(--red); font-size: 0.88rem; font-weight: 600; text-align: center; min-height: 1.2em; margin: 0; }
    .auth-switch { text-align: center; font-size: 0.88rem; color: var(--muted); margin-top: 4px; }
    .auth-switch a { color: var(--accent-ink); font-weight: 700; text-decoration: none; }
    .auth-back { text-align: center; margin-bottom: 4px; }
    .auth-back a { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
    .auth-back a:hover { color: var(--text); }
  </style>
</head>
<body class="landing">
  <div class="auth-wrap">
    <form class="auth-card" id="login-form">
      <div class="auth-back"><a href="/about">← На главную</a></div>
      <h1>Кабинет клуба</h1>
      <p class="sub">Вход по почте и паролю</p>
      <label class="field">Почта
        <input id="email" type="email" autocomplete="email" required autofocus>
      </label>
      <label class="field">Пароль
        <span class="password-row">
          <input id="password" type="password" autocomplete="current-password" required>
          <button type="button" id="password-eye" class="password-eye" title="Показать пароль" aria-label="Показать пароль">
            <i class="ic ic-eye" aria-hidden="true"></i>
          </button>
        </span>
      </label>
      <p class="auth-error" id="auth-error"></p>
      <button type="submit" class="btn btn-primary btn-lg">Войти</button>
      <p class="auth-switch">Ещё нет кабинета? <a href="/account/register">Зарегистрировать клуб</a></p>
    </form>
  </div>
  <script>
    "use strict";
    (() => {
      const input = document.getElementById("password");
      const eye = document.getElementById("password-eye");
      eye.addEventListener("click", () => {
        const shown = input.type === "text";
        input.type = shown ? "password" : "text";
        eye.classList.toggle("on", !shown);
        input.focus();
      });
    })();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("auth-error");
      errorBox.textContent = "";
      try {
        const response = await fetch("/account/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          errorBox.textContent = body.detail ?? "Не удалось войти";
          return;
        }
        window.location.href = "/account";
      } catch (err) {
        errorBox.textContent = "Сервер недоступен";
      }
    });
  </script>
</body>
</html>
