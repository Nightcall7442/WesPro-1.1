<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WesPro — панель сети клубов</title>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <script>
    // Тема — та же, что в программе клуба: светлая «сталь», тёмная по
    // выбору (общий ключ billiards_theme). Раньше панель была всегда
    // тёмной, «чтобы не путать с кассой» — но тем, кто работает и там,
    // и тут, единый вид оказался важнее.
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("billiards_theme") === "dark" ? "dark" : "light";
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/hub.css">
</head>
<body class="hub">
  <div class="layout">
  <aside class="sidebar hub-sidebar">
    <div class="hub-brand">WesPro <span>сеть клубов</span></div>
    <nav class="side-nav" id="hub-tabs">
      <button class="hub-tab nav-item" data-tab="overview" title="Сводка">
        <span class="nav-icon"><i class="ic ic-chart"></i></span><span class="nav-label">Сводка</span>
      </button>
      <button class="hub-tab nav-item" data-tab="clubs" title="Клубы">
        <span class="nav-icon"><i class="ic ic-ball"></i></span><span class="nav-label">Клубы</span>
      </button>
      <button class="hub-tab nav-item" data-tab="plans" title="Тарифы">
        <span class="nav-icon"><i class="ic ic-tag"></i></span><span class="nav-label">Тарифы</span>
      </button>
      <button class="hub-tab nav-item" data-tab="messages" title="Сообщения">
        <span class="nav-icon"><i class="ic ic-doc"></i></span><span class="nav-label">Сообщения</span>
      </button>
      <button class="hub-tab nav-item" data-tab="journal" title="Журнал сети">
        <span class="nav-icon"><i class="ic ic-list"></i></span><span class="nav-label">Журнал сети</span>
      </button>
      <button class="hub-tab nav-item" data-tab="settings" title="Настройки">
        <span class="nav-icon"><i class="ic ic-sliders"></i></span><span class="nav-label">Настройки</span>
      </button>
    </nav>
  </aside>

  <div class="content">
  <header class="topbar">
    <h1 id="hub-page-title">Сводка</h1>
    <div class="user-area">
      <button id="theme-toggle" class="mini" title="Тёмная/светлая тема"><i class="ic ic-theme"></i></button>
      <span id="hub-user-name" class="user-chip"></span>
      <button class="mini" id="hub-logout">Выйти</button>
    </div>
  </header>

  <main class="hub-main">
    <!-- Сводка -->
    <section class="hub-page" data-page="overview">
      <div class="hub-cards" id="stat-cards"></div>
      <div class="hub-split">
        <div class="hub-panel">
          <h2>Требует внимания</h2>
          <div id="attention-list" class="attention-list"></div>
        </div>
        <div class="hub-panel">
          <h2>Рост сети</h2>
          <table class="hub-table" id="growth-table"></table>
        </div>
      </div>
    </section>

    <!-- Клубы: плитки. На каждой — что в клубе прямо сейчас (из его
         базы) и подписка; проблемные всплывают первыми. -->
    <section class="hub-page" data-page="clubs" hidden>
      <div class="hub-toolbar">
        <input id="clubs-search" class="cash-input" type="search" placeholder="Поиск: название, город, телефон">
        <div class="chips" id="clubs-filters">
          <button class="chip on" data-filter="all">Все</button>
          <button class="chip" data-filter="online">На связи</button>
          <button class="chip" data-filter="problems">Проблемы</button>
          <button class="chip" data-filter="trial">Пробный</button>
          <button class="chip" data-filter="overdue">Просрочены</button>
          <button class="chip" data-filter="blocked">Заблокированы</button>
          <button class="chip" data-filter="archived">Архив</button>
        </div>
        <button class="primary" id="club-add">Добавить клуб</button>
      </div>
      <div class="club-grid" id="clubs-grid"></div>
      <p class="hub-empty" id="clubs-empty" hidden></p>
    </section>

    <!-- Тарифы -->
    <section class="hub-page" data-page="plans" hidden>
      <div class="hub-toolbar">
        <button class="primary" id="plan-add">Новый тариф</button>
      </div>
      <table class="hub-table" id="plans-table"></table>
    </section>

    <!-- Сообщения -->
    <section class="hub-page" data-page="messages" hidden>
      <div class="hub-toolbar">
        <button class="primary" id="message-add">Написать клубам</button>
      </div>
      <table class="hub-table" id="messages-table"></table>
    </section>

    <!-- Журнал сети -->
    <section class="hub-page" data-page="journal" hidden>
      <div class="hub-toolbar">
        <select id="journal-event"><option value="all">Все события</option></select>
      </div>
      <table class="hub-table" id="journal-table"></table>
    </section>

    <!-- Настройки -->
    <section class="hub-page" data-page="settings" hidden>
      <div class="hub-split">
        <div class="hub-panel">
          <h2>Правила подписки</h2>
          <div class="settings-grid" id="settings-form"></div>
          <button class="primary" id="settings-save">Сохранить</button>
        </div>
        <div class="hub-panel">
          <h2>Кто входит в панель</h2>
          <table class="hub-table" id="hub-users-table"></table>
          <button class="mini" id="hub-user-add">Добавить сотрудника</button>
        </div>
      </div>
    </section>
  </main>
  </div>
  </div>

  <div id="hub-modal-overlay" class="modal-overlay" hidden>
    <div class="modal" id="hub-modal">
      <div class="modal-head">
        <h3 id="hub-modal-title"></h3>
        <button class="modal-close" id="hub-modal-close" aria-label="Закрыть">×</button>
      </div>
      <div id="hub-modal-body"></div>
    </div>
  </div>
  <div id="hub-toasts" class="toasts"></div>

  <script src="/static/hub.js"></script>
</body>
</html>
